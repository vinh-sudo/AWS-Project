<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Enter OTP</title>
</head>
<body style="margin:0; padding:0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background-color: #ffffff; display:flex; align-items:center; justify-content:center; min-height:100vh;">
<table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #ffffff;">
    <tr>
        <td align="center" style="padding:40px 15px;">

            <!-- Main Card -->
            <table width="380" cellpadding="0" cellspacing="0" border="0" style="background:#ffffff; border-radius:16px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); overflow:hidden; position:relative;">

                <!-- Close Button -->
                <tr>
                    <td align="right" style="padding:16px 16px 0 0;">
                        <div style="width:28px; height:28px; background:#f0f0f0; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; cursor:pointer;">
                            <span style="color:#666; font-size:18px; line-height:1;">×</span>
                        </div>
                    </td>
                </tr>

                <!-- Title -->
                <tr>
                    <td align="center" style="padding:8px 40px 16px 40px;">
                        <h1 style="margin:0; color:#000000; font-size:28px; font-weight:700; letter-spacing:-0.5px;">
                            Enter OTP
                        </h1>
                    </td>
                </tr>

                <!-- Message -->
                <tr>
                    <td align="center" style="padding:0 40px 24px 40px;">
                        <p style="margin:0; color:#6b7280; font-size:14px; line-height:20px; font-weight:400;">
                            We have sent a verification code to<br>your registered email
                        </p>
                    </td>
                </tr>

                <!-- OTP Input Boxes -->
                <tr>
                    <td align="center" style="padding:0 40px 28px 40px;">
                        <table cellpadding="0" cellspacing="0" border="0" style="margin:0 auto;">
                            <tr>
                                <td align="center" style="padding:0 4px;">
                                    <div style="width:48px; height:52px; background:#f3f4f6; border:none; border-radius:12px; display:inline-block;">
                                        <table width="100%" height="100%" cellpadding="0" cellspacing="0" border="0">
                                            <tr>
                                                <td align="center" valign="middle">
                                                    <span style="font-size:24px; font-weight:600; color:#374151; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;" th:text="${otp.substring(0,1)}">1</span>
                                                </td>
                                            </tr>
                                        </table>
                                    </div>
                                </td>
                                <td align="center" style="padding:0 4px;">
                                    <div style="width:48px; height:52px; background:#f3f4f6; border:none; border-radius:12px; display:inline-block;">
                                        <table width="100%" height="100%" cellpadding="0" cellspacing="0" border="0">
                                            <tr>
                                                <td align="center" valign="middle">
                                                    <span style="font-size:24px; font-weight:600; color:#374151; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;" th:text="${otp.substring(1,2)}">2</span>
                                                </td>
                                            </tr>
                                        </table>
                                    </div>
                                </td>
                                <td align="center" style="padding:0 4px;">
                                    <div style="width:48px; height:52px; background:#f3f4f6; border:none; border-radius:12px; display:inline-block;">
                                        <table width="100%" height="100%" cellpadding="0" cellspacing="0" border="0">
                                            <tr>
                                                <td align="center" valign="middle">
                                                    <span style="font-size:24px; font-weight:600; color:#374151; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;" th:text="${otp.substring(2,3)}">3</span>
                                                </td>
                                            </tr>
                                        </table>
                                    </div>
                                </td>
                                <td align="center" style="padding:0 4px;">
                                    <div style="width:48px; height:52px; background:#f3f4f6; border:none; border-radius:12px; display:inline-block;">
                                        <table width="100%" height="100%" cellpadding="0" cellspacing="0" border="0">
                                            <tr>
                                                <td align="center" valign="middle">
                                                    <span style="font-size:24px; font-weight:600; color:#374151; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;" th:text="${otp.substring(3,4)}">4</span>
                                                </td>
                                            </tr>
                                        </table>
                                    </div>
                                </td>
                                <td align="center" style="padding:0 4px;">
                                    <div style="width:48px; height:52px; background:#f3f4f6; border:none; border-radius:12px; display:inline-block;">
                                        <table width="100%" height="100%" cellpadding="0" cellspacing="0" border="0">
                                            <tr>
                                                <td align="center" valign="middle">
                                                    <span style="font-size:24px; font-weight:600; color:#374151; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;" th:text="${otp.substring(4,5)}">5</span>
                                                </td>
                                            </tr>
                                        </table>
                                    </div>
                                </td>
                                <td align="center" style="padding:0 4px;">
                                    <div style="width:48px; height:52px; background:#f3f4f6; border:none; border-radius:12px; display:inline-block;">
                                        <table width="100%" height="100%" cellpadding="0" cellspacing="0" border="0">
                                            <tr>
                                                <td align="center" valign="middle">
                                                    <span style="font-size:24px; font-weight:600; color:#374151; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;" th:text="${otp.substring(5,6)}">6</span>
                                                </td>
                                            </tr>
                                        </table>
                                    </div>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <!-- Verify Button -->
                <tr>
                    <td align="center" style="padding:0 40px 20px 40px;">
                        <table width="100%" cellpadding="0" cellspacing="0" border="0">
                            <tr>
                                <td align="center" style="background:#6366f1; border-radius:12px; padding:14px 0;">
                                    <a href="#" style="display:block; color:#ffffff; font-size:16px; font-weight:600; text-decoration:none; letter-spacing:0.2px;">
                                        Verify
                                    </a>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <!-- Resend Code -->
                <tr>
                    <td align="center" style="padding:0 40px 32px 40px;">
                        <p style="margin:0 0 8px 0; color:#6b7280; font-size:13px; font-weight:400;">
                            Didn't receive the code?
                        </p>
                        <a href="#" style="color:#6366f1; font-size:14px; font-weight:600; text-decoration:none;">
                            Resend Code
                        </a>
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>
</body>
</html>
