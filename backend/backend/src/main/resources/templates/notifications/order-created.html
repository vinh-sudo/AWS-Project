<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div>
    <h4>🆕 New Order Created</h4>
    <p>
        Order <b>#<span th:text="${orderId}"></span></b> was created for
        <b th:text="${customer}"></b>
    </p>

    <p>
        Product: <b th:text="${product}"></b><br>
        Quantity: <b th:text="${quantity}"></b><br>
        Deadline: <b th:text="${deadline}"></b>
    </p>
</div>

</body>
</html>
