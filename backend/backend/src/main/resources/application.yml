spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:production_manager}  # Sử dụng biến môi trường cho DB_HOST, DB_PORT, DB_NAME
    username: ${DB_USERNAME:postgres}  # Sử dụng biến môi trường cho DB_USERNAME
    password: ${DB_PASSWORD:12345}  # Sử dụng biến môi trường cho DB_PASSWORD

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
